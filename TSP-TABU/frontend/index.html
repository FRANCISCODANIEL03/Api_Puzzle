<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruta Óptima - Búsqueda Tabú</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0a0a0a;
      color: #d4ffd4;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #6eff6e;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #0f0;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 30px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00cc00;
    }

    .contenedor {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .tarjetas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .tarjeta {
      background-color: #003300;
      border: 2px solid #00ff00;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px #00ff00;
      font-weight: bold;
      min-width: 100px;
      text-transform: uppercase;
    }

    .datos {
      max-width: 600px;
      text-align: left;
      margin-bottom: 20px;
      border: 2px solid #00ff00;
      padding: 10px;
      border-radius: 15px;
    }

  </style>
</head>
<body>
  <h1>Ruta con Busqueda Tabu</h1>
  <button id="btn-generar">Generar Rutas</button>
  <div class="contenedor" id="resultado"></div>
  <script src="script.js"></script>
</body>
</html>
