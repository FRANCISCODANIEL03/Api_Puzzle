<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dijkstra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Calcular ruta mas corta con Dijkstra</h1>

    <label for="nodos">Número de nodos:</label>
    <input type="number" id="nodos" min="2" value="3" />
    <button onclick="crearFormulario()">Crear grafo</button>
    <button onclick="limpiarTodo()">Limpiar</button>

    <form id="grafoForm" class="hidden">
      <div id="aristasContainer"></div>

      <label for="inicio">Nodo inicial:</label>
      <input type="text" id="inicio" required />

      <label for="fin">Nodo final:</label>
      <input type="text" id="fin" required />

      <button type="submit">Calcular ruta</button>
    </form>

    <div id="resultado" class="resultado"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
